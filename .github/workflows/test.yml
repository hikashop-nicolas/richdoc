name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      # npm ci reaches out to the registry and to GitHub for the git-hosted libs, and a timeout
      # there has been the single biggest cause of failed runs. Retry before giving up, so a
      # transient network blip does not fail a build that has nothing wrong with it.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "npm ci failed (attempt $attempt), retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "npm ci failed after 3 attempts"
          exit 1
      - run: npm run typecheck
      - run: npm test
      # What richdoc writes, judged by the official schemas rather than by itself.
      - run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: npm run check:schema
      # And judged by separate implementations that share no code with this one.
      - run: pip install --quiet python-docx odfpy
      - run: npm run check:reader
      # Microsoft's own validator, which unlike the schemas sees the whole package: part
      # structure and the relationships between parts, not only the markup.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0"
      - run: npm run check:openxml

  # LibreOffice as the oracle: it reads both the original fixture and richdoc's rewrite,
  # and the two readings are compared. Its own job because installing a word processor
  # takes longer than everything above put together, and there is no reason to make the
  # fast checks wait for it.
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      # npm ci reaches out to the registry and to GitHub for the git-hosted libs, and a timeout
      # there has been the single biggest cause of failed runs. Retry before giving up, so a
      # transient network blip does not fail a build that has nothing wrong with it.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "npm ci failed (attempt $attempt), retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "npm ci failed after 3 attempts"
          exit 1
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-writer
      - run: npm run check:lo
